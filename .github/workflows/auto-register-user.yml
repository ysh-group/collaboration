
name: Auto Invite User

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  invite-user:
    runs-on: ubuntu-latest

    # Only process invitation issues
    if: github.event.issue.title == 'Please invite me to The YSH Group GitHub Organization'

    steps:
      # 1. Parse Invitation Issue
      - name: Parse Invitation Details
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Extract fields from GitHub Issue Form Markdown
            function extractField(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

              const regex = new RegExp(
                `### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`,
                'i'
              );

              const match = body.match(regex);

              if (!match) return '';

              const value = match[1].trim();

              if (
                !value ||
                value === '_No response_' ||
                value === 'No response'
              ) {
                return '';
              }

              return value;
            }

            const name = extractField('Name (Required)');
            const email = extractField('Email (Required)');
            const linkedin = extractField('LinkedIn Profile (if applicable)');
            const twitter = extractField('Twitter Username (if applicable)');
            const additional = extractField('Additional Context (Required)');

            const username = issue.user.login;

            // Validate email and required fields
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const isValid =
              name.length > 0 &&
              emailRegex.test(email) &&
              additional.length > 0;

            core.setOutput('name', name);
            core.setOutput('email', email);
            core.setOutput('linkedin', linkedin);
            core.setOutput('twitter', twitter);
            core.setOutput('additional', additional);
            core.setOutput('username', username);
            core.setOutput('valid', String(isValid));

            console.log(`Username: ${username}`);
            console.log(`Email: ${email}`);
            console.log(`Valid: ${isValid}`);

      # 2. Approve Invitation
      - name: Approve Invitation
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          NAME: ${{ steps.parse.outputs.name }}
          EMAIL: ${{ steps.parse.outputs.email }}
          LINKEDIN: ${{ steps.parse.outputs.linkedin }}
          TWITTER: ${{ steps.parse.outputs.twitter }}
          ADDITIONAL: ${{ steps.parse.outputs.additional }}
          USERNAME: ${{ steps.parse.outputs.username }}
        with:
          script: |
            const {
              NAME,
              EMAIL,
              LINKEDIN,
              TWITTER,
              ADDITIONAL,
              USERNAME
            } = process.env;

            const issue = context.issue;

            const comment = `
            ## ✅ Invitation Request Approved!

            **Name:** ${NAME}

            **GitHub Username:** @${USERNAME}

            **Email:** ${EMAIL}

            **LinkedIn:** ${LINKEDIN || 'Not provided'}

            **Twitter:** ${TWITTER || 'Not provided'}

            **Additional Context:**

            ${ADDITIONAL}

            ---

            🎉 Your invitation request has been processed!

            You should receive an invitation to join the YSH Group GitHub Organization.

            **Don't forget to accept your invitation through your email or [HERE](https://github.com/orgs/ysh-group/invitation).**

            Welcome to the YSH Group community!
            `;

            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body: comment
            });

            await github.rest.issues.addLabels({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              labels: [
                'invitation-approved',
                'automated'
              ]
            });

            console.log(`Invitation processed for @${USERNAME}`);

      # 3. Reject Invalid Invitation
      - name: Reject Invalid Invitation
        if: steps.parse.outputs.valid == 'false'
        uses: actions/github-script@v7
        env:
          USERNAME: ${{ steps.parse.outputs.username }}
        with:
          script: |
            const username = process.env.USERNAME;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `
            ## ❌ Invitation Request Incomplete

            @${username}, your invitation request could not be processed.

            Please check that you have provided:

            - **Name:** Required
            - **Email:** A valid email address
            - **Additional Context:** Required

            Please update your issue with the missing or incorrect information.

            Once corrected, the workflow will automatically process your request.
              `
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [
                'invitation-incomplete',
                'needs-attention'
              ]
            });

      # 4. Add User to GitHub Organization
      - name: Add User to Organization
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          USERNAME: ${{ steps.parse.outputs.username }}
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = process.env.USERNAME;

            try {
              await github.rest.orgs.setMembershipForUser({
                org: 'ysh-group',
                username: username,
                role: 'member'
              });

              console.log(`Successfully added @${username} to organization`);

            } catch (error) {
              core.setFailed(
                `Could not add @${username} to organization: ${error.message}`
              );
            }

      # 5. Send Welcome Email (Logging Placeholder)
      - name: Prepare Welcome Email
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          EMAIL: ${{ steps.parse.outputs.email }}
          USERNAME: ${{ steps.parse.outputs.username }}
          NAME: ${{ steps.parse.outputs.name }}
        with:
          script: |
            const { EMAIL, USERNAME, NAME } = process.env;

            const welcomeMessage = `
            Subject: Welcome to YSH Group!

            Dear ${NAME},

            Welcome to YSH Group!

            Your invitation request has been approved.

            You can now:
            - Access organization repositories
            - Collaborate with our community
            - Contribute to our projects

            Get started: https://github.com/ysh-group

            Best regards,
            YSH Group Team
            `;

            console.log(`Welcome email prepared for ${EMAIL}`);
            console.log(welcomeMessage);

      # 6. Close Invitation Issue
      - name: Close Invitation Issue
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

            console.log('Invitation issue closed successfully');
