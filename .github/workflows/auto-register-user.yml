name: Invite User to YSH-Group

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  invite-user:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.issue.labels.*.name, 'Invitation to the community') && !contains(github.event.issue.labels.*.name, 'invitation-approved') }}
    concurrency:
      group: invitation-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Parse Invitation Issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const lines = (issue.body || '').split(/\r?\n/);

            function getField(label) {
              const heading = `### ${label}`;
              const start = lines.findIndex(line => line.trim() === heading);
              if (start === -1) return '';

              let end = lines.findIndex((line, index) =>
                index > start && /^###\s+/.test(line.trim())
              );
              if (end === -1) end = lines.length;

              const value = lines.slice(start + 1, end).join('\n').trim();
              return /^_No response_$/i.test(value) ? '' : value;
            }

            const name = getField('Name (Required)');
            const email = getField('Email (Required)');
            const additionalContext = getField('Additional Context (Required)');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const isValid = name.length > 0 && emailRegex.test(email) && additionalContext.length > 0;

            core.setOutput('name', name);
            core.setOutput('email', email);
            core.setOutput('username', issue.user.login);
            core.setOutput('valid', String(isValid));
            console.log(`Invitation details valid: ${isValid}`);

      - name: Send Organization Invitation
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          INVITEE_EMAIL: ${{ steps.parse.outputs.email }}
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            await github.rest.orgs.createInvitation({
              org: context.repo.owner,
              email: process.env.INVITEE_EMAIL,
              role: 'direct_member'
            });
            console.log('Organization invitation sent.');

      - name: Confirm Invitation
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          INVITEE_NAME: ${{ steps.parse.outputs.name }}
          INVITEE_EMAIL: ${{ steps.parse.outputs.email }}
          GITHUB_USERNAME: ${{ steps.parse.outputs.username }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Invitation sent!**\n\nHi ${process.env.INVITEE_NAME}, an invitation to the YSH-Group GitHub organization has been sent to **${process.env.INVITEE_EMAIL}**. Please accept it using the email from GitHub.\n\nGitHub account: @${process.env.GITHUB_USERNAME}`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['invitation-approved', 'automated']
            });

      - name: Reject Invalid Invitation Request
        if: steps.parse.outputs.valid == 'false'
        uses: actions/github-script@v7
        env:
          GITHUB_USERNAME: ${{ steps.parse.outputs.username }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Invitation request needs attention**\n\n@${process.env.GITHUB_USERNAME}, please edit the issue and provide your name, a valid email address, and the required Additional Context.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['invitation-incomplete', 'needs-attention']
            });

      - name: Close Invitation Issue
        if: steps.parse.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
