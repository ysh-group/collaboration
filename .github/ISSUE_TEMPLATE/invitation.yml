name: Invitation to The YSH-Group GitHub Community
description: I would like to be part of the YSH Group
title: "Please invite me to The YSH Group GitHub Organization"
labels: [Invitation to the community]
body:
  - type: input
    id: name
    attributes:
      label: Name (Required)
      placeholder: Insert your name here
    validations:
      required: true
  - type: input
    id: Email
    attributes:
      label: Email (Required)
      placeholder: Insert your email here
    validations:
      required: true
  - type: input
    id: LinkedIn
    attributes:
      label: LinkedIn Profile (if applicable)
      placeholder: Insert your LinkedIn Profile here
    validations:
      required: false
  - type: input
    id: twitter
    attributes:
      label: Twitter Username (if applicable)
      placeholder: Insert your Twitter username here
    validations:
      required: false
  - type: textarea
    id: Additional (Required)
    attributes:
      label: Additional Context
      description: Where did you meet The YSH Group? What do you like about this community/Why do you want to join?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        You can also join our Hugginface Community [here](https://huggingface.co/YSHgroup)
